name: Release

# Push a tag like v1.2.0 and this builds a signed universal APK and publishes a GitHub release
# with the matching section of CHANGELOG.md as its notes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). It must already exist."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Work out version
        id: version
        run: |
          VERSION="${TAG#v}"
          # 1.2.3 -> 10203. Pre-release suffixes (-beta.1) are ignored for the code.
          IFS='.-' read -r MAJ MIN PAT _ <<< "$VERSION"
          CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Release keystore found."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 is not set. The APK will be signed with a throwaway debug key, so users can't update over it later. See docs/RELEASING.md."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace \
            -PappVersionName=${{ steps.version.outputs.name }} \
            -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Collect artifacts
        run: |
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          OUT="dist/PrismTV-${{ steps.version.outputs.name }}-universal.apk"
          cp "$APK" "$OUT"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - name: Extract changelog section
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found=1; next } }
            found { print }
          ' CHANGELOG.md > dist/NOTES.md
          if [ ! -s dist/NOTES.md ]; then
            echo "See the commit history for what changed in this release." > dist/NOTES.md
          fi
          {
            echo ""
            echo "### Download"
            echo ""
            echo "Grab **PrismTV-$VERSION-universal.apk** below. It runs on any Android 6.0+ phone, tablet, Android TV, Google TV or Fire TV."
            echo "Checksums are in SHA256SUMS.txt."
          } >> dist/NOTES.md
          cat dist/NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Prism TV ${{ steps.version.outputs.name }}
          body_path: dist/NOTES.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/PrismTV-${{ steps.version.outputs.name }}-universal.apk
            dist/SHA256SUMS.txt
